name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Beamtalk's OTP support window (ADR 0125 §3.1: previous + current
        # major). The toolchain is built on 28 and doesn't boot on 27 (BT-4605).
        otp: ["28", "29"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}

      - name: Install Beamtalk
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --nightly --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Format check
        run: just fmt

      - name: Lint
        run: just lint
        continue-on-error: true

      - name: Build
        run: just build

      - name: Test
        run: just test
