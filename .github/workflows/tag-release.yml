# Tag a release from the version in beamtalk.toml.
#
# Run it from the Actions tab (or `gh workflow run tag-release.yml`) after the
# release PR that bumps `[package] version` has merged. It creates the tag
# v<version> on the chosen commit and a GitHub release with generated notes.
# It refuses to run if the tag already exists or the version is malformed.
#
# The package registry entry is a separate step: `beamtalk publish` from a
# machine that has pushed the tag, or a commit to jamesc/beamtalk-registry
# adding the version to packages/<name>.toml.
name: Tag release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to tag (default: main)"
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version from beamtalk.toml
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' beamtalk.toml | head -n 1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::beamtalk.toml has no X.Y.Z [package] version (found '$version')"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; bump the version in beamtalk.toml first"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
          echo "Tagged $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
